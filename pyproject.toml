[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint"
version = "0.1.0"
description = "AI-powered business location recommender"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "anthropic>=0.40.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
pinpoint = "pinpoint.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]
